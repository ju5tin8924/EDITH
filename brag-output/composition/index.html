<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background: #0B0F19;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-duration="20"
    >
      <div
        id="el-scene-1"
        data-composition-id="scene-1"
        data-composition-src="compositions/scene-1.html"
        data-start="0"
        data-duration="4.2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-scene-2"
        data-composition-id="scene-2"
        data-composition-src="compositions/scene-2.html"
        data-start="4.2"
        data-duration="4.6"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-scene-3"
        data-composition-id="scene-3"
        data-composition-src="compositions/scene-3.html"
        data-start="8.8"
        data-duration="4.2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-scene-4"
        data-composition-id="scene-4"
        data-composition-src="compositions/scene-4.html"
        data-start="13.0"
        data-duration="3.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="el-scene-5"
        data-composition-id="scene-5"
        data-composition-src="compositions/scene-5.html"
        data-start="16.5"
        data-duration="3.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio
        id="bg-music"
        src="assets/music/track.mp3"
        data-start="0"
        data-duration="20"
        data-track-index="10"
        data-volume="0.6"
      ></audio>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
