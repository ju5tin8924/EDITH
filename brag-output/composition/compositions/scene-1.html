<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: 'Plus Jakarta Sans';
          src: local('Segoe UI'), local('Arial');
        }
        @font-face {
          font-family: 'JetBrains Mono';
          src: local('Consolas'), local('Courier New');
        }
        #root {
          position: absolute;
          inset: 0;
          background: #0B0F19;
          font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
          color: #F8FAFC;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          background-size: 60px 60px;
          background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .card {
          width: 1040px;
          background: #131B2E;
          border: 1px solid #1E293B;
          border-radius: 20px;
          padding: 40px;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
          position: relative;
          overflow: hidden;
        }
        .stamp {
          position: absolute;
          inset: 0;
          background: #0B0F19;
          border: 3px solid #EF4444;
          border-radius: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          box-shadow: 0 0 50px rgba(239, 68, 68, 0.4);
          opacity: 0;
          transform: scale(1.15);
        }
      </style>

      <div id="root" data-composition-id="scene-1" data-width="1920" data-height="1080">
        <div id="s1-badge" class="mono" style="font-size: 15px; color: #22D3EE; background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); padding: 8px 24px; border-radius: 30px; margin-bottom: 24px; letter-spacing: 2px;">
          INBOUND SWIFT MT103 WIRE PAYMENT INGESTION
        </div>

        <div id="s1-card" class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1E293B; padding-bottom: 20px; margin-bottom: 24px;">
            <div>
              <div style="font-size: 13px; color: #94A3B8; text-transform: uppercase; letter-spacing: 1.5px;" class="mono">Transaction Reference</div>
              <div class="mono" style="font-size: 20px; font-weight: 700; color: #F8FAFC;">TX-2026-9921448-AE</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 13px; color: #94A3B8; text-transform: uppercase; letter-spacing: 1.5px;" class="mono">Wire Amount</div>
              <div class="mono" style="font-size: 32px; font-weight: 800; color: #22D3EE;">$450,000.00 USD</div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px;">
            <div style="background: #0B0F19; border: 1px solid #1E293B; border-radius: 12px; padding: 20px;">
              <div style="font-size: 12px; color: #94A3B8;" class="mono">ORIGINATING CUSTOMER (SENDER)</div>
              <div style="font-size: 18px; font-weight: 700; margin-top: 6px; color: #E2E8F0;">Rashid International Trading FZE</div>
              <div class="mono" style="font-size: 12px; color: #94A3B8; margin-top: 4px;">AE820330000001234567890 (Dubai, UAE)</div>
            </div>

            <div id="s1-beneficiary-box" style="background: #0B0F19; border: 1px solid #1E293B; border-radius: 12px; padding: 20px;">
              <div style="font-size: 12px; color: #94A3B8;" class="mono">BENEFICIARY CUSTOMER (RECIPIENT)</div>
              <div style="font-size: 22px; font-weight: 800; margin-top: 6px; color: #FFFFFF;">Victor Bout</div>
              <div class="mono" style="font-size: 12px; color: #94A3B8; margin-top: 4px;">CH9300762011623852957 (Zurich, CH)</div>
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; background: #0F1626; padding: 18px 28px; border-radius: 12px; border: 1px solid #1E293B;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <div style="width: 12px; height: 12px; border-radius: 50%; background: #06B6D4; box-shadow: 0 0 12px #06B6D4;"></div>
              <span style="font-size: 15px; color: #94A3B8;">Real-Time Pipeline Evaluation Latency:</span>
            </div>
            <div class="mono" style="font-size: 28px; font-weight: 800; color: #22D3EE;">
              <span id="s1-timer">0.0</span> ms
            </div>
          </div>

          <div id="s1-stamp" class="stamp" data-layout-allow-overlap data-layout-allow-occlusion>
            <div style="width: 80px; height: 80px; border-radius: 50%; background: rgba(239, 68, 68, 0.2); border: 2px solid #EF4444; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
              <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            </div>
            <div class="mono" data-layout-allow-overlap style="font-size: 38px; font-weight: 900; color: #EF4444; letter-spacing: 4px;">BLOCKED: STATUTORY FREEZE</div>
            <div class="mono" data-layout-allow-overlap style="font-size: 18px; color: #F87171; margin-top: 8px;">INTERCEPTED IN 8.4ms • RISK SCORE: 96.4 / 100</div>
            <div data-layout-allow-overlap style="font-size: 14px; color: #94A3B8; margin-top: 12px;">UN Security Council Res 1521 / OFAC SDN Hit</div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#s1-badge", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5 }, 0.2);
        tl.fromTo("#s1-card", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.5 }, 0.3);

        const timerObj = { val: 0.0 };
        tl.to(timerObj, {
          val: 8.4,
          duration: 1.6,
          ease: "power2.out",
          onUpdate: () => {
            const el = document.getElementById("s1-timer");
            if (el) el.innerText = timerObj.val.toFixed(1);
          }
        }, 0.7);

        tl.to("#s1-beneficiary-box", { borderColor: "#EF4444", duration: 0.2 }, 2.4);
        tl.fromTo("#s1-stamp", 
          { opacity: 0, scale: 1.25 }, 
          { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 
          2.5
        );
        tl.to("#root", { opacity: 0, scale: 0.96, duration: 0.35 }, 3.8);

        window.__timelines["scene-1"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
