apiVersion: apps/v1
kind: Deployment
metadata:
  name: edith-addons
  namespace: default
  labels:
    app: edith-addons
    app.kubernetes.io/name: edith-addons
    app.kubernetes.io/part-of: edith
spec:
  replicas: {{ .Values.addons.replicaCount }}
  selector:
    matchLabels:
      app: edith-addons
  template:
    metadata:
      labels:
        app: edith-addons
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5004"
    spec:
      containers:
        - name: addons-service
          image: "{{ .Values.addons.image.repository }}:{{ .Values.addons.image.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - containerPort: 5004
              name: http
          envFrom:
            - configMapRef:
                name: edith-cluster-config
            - secretRef:
                name: edith-cluster-secrets
          resources:
            {{- toYaml .Values.addons.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edith-addons
  namespace: default
  labels:
    app: edith-addons
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.addons.service.port }}
      targetPort: {{ .Values.addons.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: edith-addons
