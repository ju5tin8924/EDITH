apiVersion: apps/v1
kind: Deployment
metadata:
  name: edith-gateway
  namespace: default
  labels:
    app: edith-gateway
    app.kubernetes.io/name: edith-gateway
    app.kubernetes.io/part-of: edith
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: edith-gateway
  template:
    metadata:
      labels:
        app: edith-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: edith-cluster-config
            - secretRef:
                name: edith-cluster-secrets
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edith-gateway
  namespace: default
  labels:
    app: edith-gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: edith-gateway
