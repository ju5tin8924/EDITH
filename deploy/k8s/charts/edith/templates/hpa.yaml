{{- if .Values.screening.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edith-screening-hpa
  namespace: default
  labels:
    app.kubernetes.io/part-of: edith
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edith-screening
  minReplicas: {{ .Values.screening.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.screening.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.screening.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
{{- end }}
---
{{- if .Values.gateway.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edith-gateway-hpa
  namespace: default
  labels:
    app.kubernetes.io/part-of: edith
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edith-gateway
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
