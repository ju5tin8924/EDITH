apiVersion: apps/v1
kind: Deployment
metadata:
  name: edith-cases
  namespace: default
  labels:
    app: edith-cases
    app.kubernetes.io/name: edith-cases
    app.kubernetes.io/part-of: edith
spec:
  replicas: {{ .Values.cases.replicaCount }}
  selector:
    matchLabels:
      app: edith-cases
  template:
    metadata:
      labels:
        app: edith-cases
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5002"
    spec:
      containers:
        - name: cases-service
          image: "{{ .Values.cases.image.repository }}:{{ .Values.cases.image.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - containerPort: 5002
              name: http
          envFrom:
            - configMapRef:
                name: edith-cluster-config
            - secretRef:
                name: edith-cluster-secrets
          resources:
            {{- toYaml .Values.cases.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edith-cases
  namespace: default
  labels:
    app: edith-cases
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.cases.service.port }}
      targetPort: {{ .Values.cases.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: edith-cases
