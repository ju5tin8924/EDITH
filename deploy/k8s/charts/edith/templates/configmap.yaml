apiVersion: v1
kind: ConfigMap
metadata:
  name: edith-cluster-config
  namespace: default
  labels:
    app.kubernetes.io/part-of: edith
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  DOTNET_PRINT_TELEMETRY_MESSAGE: "false"
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDatabase | quote }}
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  OPENSEARCH_URI: {{ .Values.config.opensearchUri | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelCollectorEndpoint | quote }}
  OTEL_SERVICE_NAME: "edith-mesh"
