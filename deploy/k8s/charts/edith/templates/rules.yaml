apiVersion: apps/v1
kind: Deployment
metadata:
  name: edith-rules
  namespace: default
  labels:
    app: edith-rules
    app.kubernetes.io/name: edith-rules
    app.kubernetes.io/part-of: edith
spec:
  replicas: {{ .Values.rules.replicaCount }}
  selector:
    matchLabels:
      app: edith-rules
  template:
    metadata:
      labels:
        app: edith-rules
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5003"
    spec:
      containers:
        - name: rules-service
          image: "{{ .Values.rules.image.repository }}:{{ .Values.rules.image.tag }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          ports:
            - containerPort: 5003
              name: http
          envFrom:
            - configMapRef:
                name: edith-cluster-config
            - secretRef:
                name: edith-cluster-secrets
          resources:
            {{- toYaml .Values.rules.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: edith-rules
  namespace: default
  labels:
    app: edith-rules
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.rules.service.port }}
      targetPort: {{ .Values.rules.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: edith-rules
