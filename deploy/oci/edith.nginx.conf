server {
    listen 80;
    listen [::]:80;
    server_name 144.21.52.172 edith-vcn.subnet11011011.vcn11011011.oraclevcn.com _;

    root /var/www/edith-portal;
    index index.html;

    client_max_body_size 100M;

    # API Gateway REST endpoints & health checks
    location ~ ^/(api|health|healthz) {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SignalR Real-Time WebSockets (/hubs/cases, /hubs/jobs)
    location /hubs/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # React 19 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
