name: EDITH Enterprise CI/CD Pipeline (OCI ARM64)

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  TARGET_RID: 'linux-arm64'

jobs:
  backend-build-test:
    name: .NET 10 Build, Test & ARM64 Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore Edith.slnx

      - name: Build Solution (TreatWarningsAsErrors)
        run: dotnet build Edith.slnx --configuration Release --no-restore

      - name: Run Automated Test Suites
        run: dotnet test Edith.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Publish ARM64 Artifacts (linux-arm64)
        run: |
          dotnet publish src/Gateway/Edith.Gateway/Edith.Gateway.csproj \
            -c Release -r ${{ env.TARGET_RID }} --self-contained false \
            -p:UseAppHost=true -p:ErrorOnDuplicatePublishOutputFiles=false \
            -o publish/gateway
          dotnet publish src/Screening/Edith.Screening.Api/Edith.Screening.Api.csproj \
            -c Release -r ${{ env.TARGET_RID }} --self-contained false \
            -p:UseAppHost=true \
            -o publish/screening-api
          dotnet publish src/Database/Edith.Database.Migrator/Edith.Database.Migrator.csproj \
            -c Release -r ${{ env.TARGET_RID }} --self-contained false \
            -p:UseAppHost=true \
            -o publish/migrator

      - name: Upload ARM64 Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edith-backend-linux-arm64
          path: publish/
          retention-days: 7

  database-migration-drift-check:
    name: PostgreSQL 17 Migration Checksum & Drift Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify Migration Checksums
        run: dotnet test tests/Edith.Database.Migrator.Tests --configuration Release

  frontend-build:
    name: React 19 + Vite Production Build (ARM64 Target)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web/edith-portal
    env:
      npm_config_arch: arm64
      npm_config_target_arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Web/edith-portal/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Typecheck & Production Vite Build
        run: npm run build

      - name: Upload Frontend Portal Bundle
        uses: actions/upload-artifact@v4
        with:
          name: edith-portal-dist
          path: src/Web/edith-portal/dist/
          retention-days: 7

  container-security-scan:
    name: Security Audit & Deploy Script Self-Check
    needs: [backend-build-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate OCI Deployment Script Self-Check
        run: |
          chmod +x deploy/oci/deploy.sh deploy/oci/bootstrap-vm.sh
          ./deploy/oci/deploy.sh --self-check
          bash -n deploy/oci/bootstrap-vm.sh

      - name: Audit NuGet & NPM Dependencies for High/Critical Vulnerabilities
        run: |
          dotnet restore Edith.slnx
          dotnet list Edith.slnx package --vulnerable --include-transitive
          npm --prefix src/Web/edith-portal audit --omit=dev --audit-level=high || true

  deploy-oci-arm64:
    name: Deploy to OCI UK-South ARM64 VM (144.21.52.172)
    needs:
      - backend-build-test
      - database-migration-drift-check
      - frontend-build
      - container-security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: oci-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@v4

      - name: Download ARM64 Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: edith-backend-linux-arm64
          path: staging/

      - name: Download Frontend Portal Bundle
        uses: actions/download-artifact@v4
        with:
          name: edith-portal-dist
          path: staging/portal/

      - name: Stage Server-Side Execution Scripts
        run: |
          mkdir -p staging/deploy
          cp deploy/oci/deploy.sh deploy/oci/bootstrap-vm.sh deploy/oci/edith.nginx.conf deploy/oci/*.service staging/deploy/
          chmod +x staging/deploy/deploy.sh staging/deploy/bootstrap-vm.sh

      - name: Configure SSH Key & Host Verification
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP || '144.21.52.172' }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          if [ -z "${OCI_SSH_KEY}" ]; then
            echo "::error::Missing required repository secret OCI_SSH_KEY. Configure secrets via 'gh secret set' before deploying to ${SERVER_IP}."
            exit 1
          fi
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${OCI_SSH_KEY}" > ~/.ssh/id_oci
          chmod 0600 ~/.ssh/id_oci
          touch ~/.ssh/known_hosts
          if [ -n "${OCI_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${OCI_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            for attempt in 1 2 3 4 5; do
              ssh-keyscan -T 15 -p "${SSH_PORT}" -H "${SERVER_IP}" >> ~/.ssh/known_hosts && break || sleep 5
            done
          fi
          chmod 0600 ~/.ssh/known_hosts

      - name: Transfer ARM64 Artifacts via Rsync over SSH
        env:
          SERVER_IP: ${{ secrets.SERVER_IP || '144.21.52.172' }}
          SSH_USER: ${{ secrets.OCI_SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_oci -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=10"
          for attempt in 1 2 3; do
            ${SSH_CMD} "${SSH_USER}@${SERVER_IP}" "mkdir -p /tmp/edith-staging" && break || { echo "SSH connection attempt $attempt failed, retrying in 5s..."; sleep 5; }
          done
          for attempt in 1 2 3; do
            rsync -avz --delete \
              -e "${SSH_CMD}" \
              staging/ "${SSH_USER}@${SERVER_IP}:/tmp/edith-staging/" && break || { echo "Rsync transfer attempt $attempt failed, retrying in 5s..."; sleep 5; }
          done

      - name: Execute Server-Side Deployment & Health Checks
        env:
          SERVER_IP: ${{ secrets.SERVER_IP || '144.21.52.172' }}
          SSH_USER: ${{ secrets.OCI_SSH_USER || 'ubuntu' }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
          EDITH_PG_CONNECTION: ${{ secrets.EDITH_PG_CONNECTION }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ISSUER: ${{ vars.JWT_ISSUER || 'https://edith.aml.cloud' }}
          JWT_AUDIENCE: ${{ vars.JWT_AUDIENCE || 'https://edith.aml.cloud' }}
          OPENSEARCH_URL: ${{ vars.OPENSEARCH_URL || 'https://127.0.0.1:9200' }}
          OPENSEARCH_USER: ${{ vars.OPENSEARCH_USER || 'admin' }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
          OPENSEARCH_SKIP_SSL_VALIDATION: ${{ vars.OPENSEARCH_SKIP_SSL_VALIDATION || 'false' }}
          EDITH_SMTP_USER: ${{ vars.EDITH_SMTP_USER || 'notifications@edith.aml.cloud' }}
          EDITH_SMTP_PASSWORD: ${{ secrets.EDITH_SMTP_PASSWORD }}
        run: |
          ENV_PAYLOAD="$(
            for var in EDITH_PG_CONNECTION JWT_SECRET JWT_ISSUER JWT_AUDIENCE \
                       OPENSEARCH_URL OPENSEARCH_USER OPENSEARCH_PASSWORD \
                       OPENSEARCH_SKIP_SSL_VALIDATION EDITH_SMTP_USER EDITH_SMTP_PASSWORD; do
              printf 'export %s=%q\n' "${var}" "${!var}"
            done
          )"
          SSH_CMD="ssh -i ~/.ssh/id_oci -p ${SSH_PORT} -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=10"
          for attempt in 1 2 3 4 5; do
            printf '%s\n' "${ENV_PAYLOAD}" | ${SSH_CMD} "${SSH_USER}@${SERVER_IP}" \
              "umask 077 && cat > /tmp/edith-staging/.deploy.env && bash /tmp/edith-staging/deploy/deploy.sh" && break || {
                if [ "${attempt}" -eq 5 ]; then
                  echo "::error::Deployment failed after 5 attempts."
                  exit 1
                fi
                echo "Deployment attempt ${attempt} failed, retrying in 5s..."
                sleep 5
              }
          done

      - name: Cleanup Local SSH Key
        if: always()
        run: rm -f ~/.ssh/id_oci ~/.ssh/known_hosts
